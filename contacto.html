<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>

    <!-- Importación de la fuente Poppins desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Librería SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="contact-container">
        <!-- LADO IZQUIERDO: ILUSTRACIÓN -->
        <div class="contact-left">
            <div class="illustration">
                <div class="sol"></div>
                <div class="chat">...</div>
                <div class="regards">♥ SALUDOS</div>
                
                <div class="hours">
                    <small>SOPORTE</small>
                    <strong>24/7</strong>
                </div>

                <div class="laptop">
                    <div class="screen">
                        <div class="screen-bar">
                            <span></span><span></span><span></span>
                        </div>
                        <div class="screen-content">
                            <div class="message-box">✉</div>
                        </div>
                    </div>
                    <div class="keyboard">
                        <div></div>
                    </div>
                </div>

                <div class="globe">🌐</div>
                <div class="share">&lt;/&gt;</div>
            </div>

            <h1>CONTÁCTANOS</h1>
        </div>

        <!-- LADO DERECHO: FORMULARIO EN ESPAÑOL -->
        <div class="contact-right">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">NOMBRE</label>
                    <input type="text" id="name" name="name" placeholder="Nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="company">EMPRESA</label>
                    <input type="text" id="company" name="company" placeholder="Nombre de la empresa">
                </div>

                <div class="form-group">
                    <label for="phone">TELÉFONO</label>
                    <input type="tel" id="phone" name="phone" placeholder="Número de teléfono">
                </div>

                <div class="form-group">
                    <label for="email">CORREO ELECTRÓNICO</label>
                    <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
                </div>

                <div class="form-group">
                    <label for="subject">ASUNTO DEL MENSAJE</label>
                    <input type="text" id="subject" name="subject" placeholder="Describe brevemente el asunto" required>
                </div>

                <div class="form-group">
                    <label for="message">MENSAJE</label>
                    <textarea id="message" name="message" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit">ENVIAR MENSAJE</button>
            </form>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
